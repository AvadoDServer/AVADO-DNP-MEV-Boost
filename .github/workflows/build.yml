name: Build
on:
  pull_request:
    paths-ignore:
      - relays.json
      - relays.md
      - scripts/**
      - .relay-check/**
      - .github/**
      - README.md
      - docs/**
      - package.json
      - .gitignore
      - build/tests/**
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: AvadoDServer/ci-build-action@main
