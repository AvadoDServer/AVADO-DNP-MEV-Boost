name: Publish relay list
on:
  push:
    branches: [main]
    paths: [relays.json]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/check-relays.mjs
      - run: node scripts/publish.mjs
        env:
          BO_ADMIN_TOKEN: ${{ secrets.BO_ADMIN_TOKEN }}
